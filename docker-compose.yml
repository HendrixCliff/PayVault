version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: src/PayVault.API/Dockerfile
    container_name: payvault-api
    ports:
      - "5000:80"
    depends_on:
      - postgres
      - seq
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=PayVaultDb;Username=postgres;Password=postgres
      - Serilog__WriteTo__0__Name=Seq
      - Serilog__WriteTo__0__Args__serverUrl=http://seq:80
      - Redis__Configuration=redis:6379
    restart: always

  postgres:
    image: postgres:15
    container_name: payvault-db
    environment:
      POSTGRES_DB: PayVaultDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  seq:
    image: datalust/seq
    container_name: payvault-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=MyStrongPassword123!
    ports:
      - "5341:80"
    volumes:
      - seqdata:/data
    restart: always

  redis:
    image: redis:7
    container_name: payvault-redis
    ports:
      - "6379:6379"
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: payvault-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana
    container_name: payvault-grafana
    ports:
      - "3000:3000"
    restart: always

volumes:
  pgdata:
  seqdata: